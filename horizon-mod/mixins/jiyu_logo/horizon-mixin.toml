[mod]
id = "jiyu_logo"
version = "1.0.0"
priority = 100

# Probado contra esta revisión de Horizon. Solo usa ganchos nativos (API 410: native_gui_render_post),
# así que el launcher lo compila en cualquier Horizon que los tenga.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "jiyu_logo"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "logo"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_gui_render_post"
helper = "logo.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "gui_hidden", ty = "bool", value = "gui_hidden" },
]
