[package]
name = "jiyu-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher de Minecraft con la estructura de Prism que usa Horizon como motor"
license = "MIT"

[[bin]]
name = "jiyu-launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["wgpu", "tiny-skia", "image-without-codecs", "tokio", "advanced"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.42", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "fs", "macros", "rt-multi-thread", "net", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
